const W = 340, H = 150, M = {t: 10, r: 12, b: 20, l: 48};
const fmt = (v, dec = 0) => v == null ? "-" : v.toLocaleString("ko-KR", {minimumFractionDigits: dec, maximumFractionDigits: dec});
const md = d => d ? d.slice(5).replace("-", "/") : "—";
const sleeveKo = s => s === "momentum" ? '<span class="mom">모멘텀</span>' : s === "defense" ? '<span class="def">방어</span>' : s;

function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || Math.abs(hi) || 1;
  const step = Math.pow(10, Math.floor(Math.log10(span / n)));
  const cands = [1, 2, 2.5, 5, 10].map(m => m * step);
  const s = cands.find(c => span / c <= n) || cands[cands.length - 1];
  const out = []; for (let v = Math.ceil(lo / s) * s; v <= hi; v += s) out.push(v); return out;
}

// 요약
(function () {
  const ns = DATA.next_signals || {};
  const nx = ["1", "6", "11", "16", "0"].map(t => `T${t} ${md(ns[t])}`).join(" · ");
  document.getElementById("summary").innerHTML =
    `<span>보유 <b>${DATA.positions.length}</b>종목</span>` +
    `<span>목록 밖(매도 대상) <b class="${DATA.n_outside ? "no" : ""}">${DATA.n_outside}</b></span>` +
    `<span>귀속 없음 <b>${DATA.n_unassigned}</b></span>` +
    `<span>다음 신호일 — ${nx}</span>`;
})();

const grid = document.getElementById("grid");
function render(filter) {
  grid.innerHTML = "";
  for (const p of DATA.positions) {
    const sleeves = new Set(p.lots.map(l => l.sleeve));
    if (filter === "check" && p.status === "유지") continue;
    if ((filter === "momentum" || filter === "defense") && !sleeves.has(filter)) continue;
    const card = document.createElement("div"); card.className = "card" + (p.status.startsWith("목록 밖") ? " outside" : "");
    const h2 = document.createElement("h2");
    h2.textContent = `${p.name} `;
    const sm = document.createElement("small"); sm.textContent = `${p.code} · ${fmt(p.qty)}주 · 평단 ${fmt(p.avg_price)}`;
    h2.appendChild(sm); card.appendChild(h2);

    const pnl = document.createElement("div"); pnl.className = "pnl";
    pnl.style.color = p.pnl_pct > 0 ? "var(--up)" : (p.pnl_pct < 0 ? "var(--down)" : "var(--ink-2)");
    pnl.textContent = `${p.pnl_pct >= 0 ? "+" : ""}${fmt(p.pnl_pct, 2)}%`;
    const b = document.createElement("span");
    b.className = "badge " + (p.status === "유지" ? "keep" : p.status === "귀속 없음" ? "none" : "out");
    b.textContent = p.status === "유지" ? "유지 — 전 로트 목록 포함" : p.status === "귀속 없음" ? "귀속 없음 — 원장에 로트 없음(당일 매도 전송 등)" : `${p.status} — 다음 판정(08:50) 매도 대상`;
    pnl.appendChild(b); card.appendChild(pnl);

    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = (p.first_entry ? `첫 편입 ${p.first_entry}` : "편입 미상") + (p.earnings ? ` · ${p.earnings}` : "");
    card.appendChild(meta);

    if (p.lots.length) {
      const tb = document.createElement("table"); tb.className = "lots";
      tb.innerHTML = "<tr><th>트랜치</th><th>슬리브</th><th>수량</th><th>편입</th><th>동결 목록</th><th>다음 판정</th></tr>" +
        p.lots.map(l => `<tr><td>T${l.tranche}</td><td>${sleeveKo(l.sleeve)}</td><td>${fmt(l.qty)}</td><td>${md(l.entry)}</td>` +
          `<td class="${l.in_list === false ? "no" : l.in_list ? "ok" : ""}">${l.in_list == null ? "미동결" : (l.in_list ? "포함" : "밖")}${l.signal ? ` <span style="color:var(--ink-mut)">(${md(l.signal)})</span>` : ""}</td>` +
          `<td>${md(l.next_signal)}</td></tr>`).join("");
      card.appendChild(tb);
    }
    const hints = [];
    if (p.hint && p.hint.momentum !== undefined) hints.push(p.hint.momentum ? `최신 모델 추천(${md(p.hint.momentum.date)}) ${p.hint.momentum.rank}위/${p.hint.momentum.n}` : "최신 모델 추천 권외");
    if (p.hint && p.hint.defense !== undefined) hints.push(p.hint.defense ? `최신 고배당 목록(${md(p.hint.defense.date)}) ${p.hint.defense.rank}위/${p.hint.defense.n}` : "최신 고배당 목록 권외");
    if (hints.length) { const hd = document.createElement("div"); hd.className = "hint"; hd.textContent = "참고: " + hints.join(" · ") + " — 다음 목록에 남을지의 힌트일 뿐, 판정은 신호일 목록으로"; card.appendChild(hd); }

    if (!p.dates.length) {
      const none = document.createElement("div"); none.className = "meta"; none.textContent = "(시세 없음 — 차트 생략)";
      card.appendChild(none); grid.appendChild(card); continue;
    }
    const n = p.dates.length, xmax = n - 1;
    const all = [...p.close, p.avg_price].filter(v => v != null);
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = (hi - lo || Math.abs(hi) || 1) * 0.08; lo -= pad; hi += pad;
    const X = i => M.l + (W - M.l - M.r) * (xmax ? i / xmax : 0.5);
    const Y = v => M.t + (H - M.t - M.b) * (1 - (v - lo) / (hi - lo));
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("tabindex", "0"); svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", `${p.name} 편입 이후 종가`);
    for (const t of niceTicks(lo, hi)) {
      const ln = document.createElementNS(NS, "line");
      ln.setAttribute("x1", M.l); ln.setAttribute("x2", W - M.r); ln.setAttribute("y1", Y(t)); ln.setAttribute("y2", Y(t));
      ln.setAttribute("stroke", "var(--grid)"); svg.appendChild(ln);
      const tx = document.createElementNS(NS, "text");
      tx.setAttribute("x", M.l - 5); tx.setAttribute("y", Y(t) + 3.5); tx.setAttribute("text-anchor", "end"); tx.setAttribute("class", "tick");
      tx.textContent = fmt(t); svg.appendChild(tx);
    }
    for (const i of [0, Math.round(n / 2), n - 1]) {
      const tx = document.createElementNS(NS, "text");
      tx.setAttribute("x", X(i)); tx.setAttribute("y", H - 6); tx.setAttribute("text-anchor", i === 0 ? "start" : "middle");
      tx.setAttribute("class", "tick"); tx.textContent = md(p.dates[i]); svg.appendChild(tx);
    }
    const poly = (vals, color, width, dash) => {
      const pts = vals.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean);
      if (!pts.length) return;
      const pl = document.createElementNS(NS, "polyline");
      pl.setAttribute("points", pts.join(" ")); pl.setAttribute("fill", "none"); pl.setAttribute("stroke", color);
      pl.setAttribute("stroke-width", width); if (dash) pl.setAttribute("stroke-dasharray", dash);
      pl.setAttribute("stroke-linejoin", "round"); svg.appendChild(pl);
    };
    // 로트 편입 시점(트랜치 라벨), 평단, 종가
    let labelY = M.t + 9;
    for (const l of p.lots) {
      if (!l.entry) continue;
      const ei = p.dates.findIndex(d => d >= l.entry); if (ei < 0) continue;
      const ln = document.createElementNS(NS, "line");
      ln.setAttribute("x1", X(ei)); ln.setAttribute("x2", X(ei)); ln.setAttribute("y1", M.t); ln.setAttribute("y2", H - M.b);
      ln.setAttribute("stroke", l.sleeve === "defense" ? "var(--def)" : "var(--mom)"); ln.setAttribute("stroke-dasharray", "3 3"); svg.appendChild(ln);
      const tx = document.createElementNS(NS, "text");
      tx.setAttribute("x", Math.min(X(ei) + 3, W - M.r - 28)); tx.setAttribute("y", labelY); tx.setAttribute("class", "lbl");
      tx.textContent = `T${l.tranche}`; svg.appendChild(tx);
      labelY = labelY >= H - M.b - 12 ? M.t + 9 : labelY + 11;
    }
    poly(Array(n).fill(p.avg_price), "var(--axis)", 1, "2 3");
    poly(p.close, "var(--s1)", 2);
    const endLbl = (v, text, dy) => { const tx = document.createElementNS(NS, "text"); tx.setAttribute("x", W - M.r); tx.setAttribute("y", Math.min(Math.max(Y(v) + dy, M.t + 8), H - M.b - 2)); tx.setAttribute("text-anchor", "end"); tx.setAttribute("class", "lbl"); tx.textContent = text; svg.appendChild(tx); };
    endLbl(p.close[n - 1], `종가 ${fmt(p.close[n - 1])}`, 3);
    endLbl(p.avg_price, `평단 ${fmt(p.avg_price)}`, p.close[n - 1] >= p.avg_price ? 13 : -7);

    const cross = document.createElementNS(NS, "line");
    cross.setAttribute("y1", M.t); cross.setAttribute("y2", H - M.b); cross.setAttribute("stroke", "var(--axis)"); cross.style.display = "none"; svg.appendChild(cross);
    const tip = document.createElement("div"); tip.className = "tip"; let idx = -1;
    const showAt = i => {
      idx = i = Math.max(0, Math.min(n - 1, i));
      cross.style.display = ""; cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i));
      tip.style.display = "block";
      tip.innerHTML = `<div class="d">${p.dates[i]}</div><div class="row"><span class="n">종가</span><b>${fmt(p.close[i])}</b></div><div class="row"><span class="n">평단 대비</span><b>${p.close[i] == null ? "-" : ((p.close[i] / p.avg_price - 1) * 100).toFixed(2) + "%"}</b></div>`;
      const rect = svg.getBoundingClientRect();
      tip.style.left = Math.min(X(i) / W * rect.width + 12, rect.width - 130) + "px"; tip.style.top = "60px";
    };
    const hide = () => { cross.style.display = "none"; tip.style.display = "none"; idx = -1; };
    svg.addEventListener("pointermove", e => { const rect = svg.getBoundingClientRect(); showAt(Math.round(((e.clientX - rect.left) / rect.width * W - M.l) / (W - M.l - M.r) * xmax)); });
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("focus", () => showAt(n - 1)); svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", e => { if (e.key === "ArrowLeft") { showAt(idx - 1); e.preventDefault(); } if (e.key === "ArrowRight") { showAt(idx + 1); e.preventDefault(); } });
    card.appendChild(svg); card.appendChild(tip);
    grid.appendChild(card);
  }
}
render("all");
document.querySelectorAll("#filters button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#filters button").forEach(x => x.setAttribute("aria-pressed", "false"));
  b.setAttribute("aria-pressed", "true"); render(b.dataset.f);
}));
</script>
